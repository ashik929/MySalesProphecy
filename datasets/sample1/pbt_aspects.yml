version: 1
schema:
  type: struct
  fields:
  - name: account
    type:
      type: struct
      fields:
      - name: created
        type: string
        nullable: true
        metadata:
          description: The date when the account was created
          mappings: []
          tags: []
      - name: status
        type: string
        nullable: true
        metadata:
          description: Current status of the account
          mappings: []
          tags: []
      - name: subscription
        type:
          type: struct
          fields:
          - name: renewal
            type:
              type: struct
              fields:
              - name: autoRenew
                type: boolean
                nullable: true
                metadata:
                  description: Indicates if the subscription will automatically renew
                  mappings: []
                  tags: []
              - name: nextBillingDate
                type: string
                nullable: true
                metadata:
                  description: The date of the next billing cycle for the subscription
                  mappings: []
                  tags: []
            nullable: true
            metadata:
              description: Information regarding the renewal settings of the subscription
              mappings: []
              tags: []
          - name: type
            type: string
            nullable: true
            metadata:
              description: Type of subscription held by the account
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: Details about the user's subscription
          mappings: []
          tags: []
    nullable: true
    metadata:
      description: The overall account information for the user
      mappings: []
      tags: []
  - name: login
    type:
      type: struct
      fields:
      - name: ip
        type: string
        nullable: true
        metadata:
          description: IP address from which the user logged in
          mappings: []
          tags: []
      - name: location
        type:
          type: struct
          fields:
          - name: city
            type: string
            nullable: true
            metadata:
              description: City from which the user logged in
              mappings: []
              tags: []
          - name: country
            type: string
            nullable: true
            metadata:
              description: Country from which the user logged in
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: The geographical location of the user's login
          mappings: []
          tags: []
      - name: timestamp
        type: string
        nullable: true
        metadata:
          description: Timestamp of when the user logged in
          mappings: []
          tags: []
    nullable: true
    metadata:
      description: Details related to the user's login activity
      mappings: []
      tags: []
  - name: paymentMethod
    type:
      type: struct
      fields:
      - name: card
        type:
          type: struct
          fields:
          - name: brand
            type: string
            nullable: true
            metadata:
              description: Brand of the payment card
              mappings: []
              tags: []
          - name: expiry
            type:
              type: struct
              fields:
              - name: month
                type: long
                nullable: true
                metadata:
                  description: Month when the payment card expires
                  mappings: []
                  tags: []
              - name: year
                type: long
                nullable: true
                metadata:
                  description: Year when the payment card expires
                  mappings: []
                  tags: []
            nullable: true
            metadata:
              description: Expiration details of the payment card
              mappings: []
              tags: []
          - name: last4
            type: string
            nullable: true
            metadata:
              description: Last four digits of the payment card used
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: Details of the card used for payment
          mappings: []
          tags: []
      - name: email
        type: string
        nullable: true
        metadata:
          description: Email associated with the payment method
          mappings: []
          tags: []
      - name: type
        type: string
        nullable: true
        metadata:
          description: Type of payment method used
          mappings: []
          tags: []
    nullable: true
    metadata:
      description: Details of the payment method used by the user
      mappings: []
      tags: []
  - name: purchase
    type:
      type: struct
      fields:
      - name: amount
        type: double
        nullable: true
        metadata:
          description: Total amount of the purchase made
          mappings: []
          tags: []
      - name: currency
        type: string
        nullable: true
        metadata:
          description: Currency used for the purchase
          mappings: []
          tags: []
      - name: date
        type: string
        nullable: true
        metadata:
          description: Date when the purchase was made
          mappings: []
          tags: []
      - name: id
        type: string
        nullable: true
        metadata:
          description: Unique identifier for the purchase transaction
          mappings: []
          tags: []
      - name: items
        type:
          type: array
          elementType:
            type: struct
            fields:
            - name: name
              type: string
              nullable: true
              metadata:
                description: Name of each item purchased
                mappings: []
                tags: []
            - name: qty
              type: long
              nullable: true
              metadata:
                description: Quantity of items purchased
                mappings: []
                tags: []
            - name: sku
              type: string
              nullable: true
              metadata:
                description: Stock Keeping Unit identifier for the purchased item
                mappings: []
                tags: []
          containsNull: true
        nullable: true
        metadata:
          description: List of items included in the purchase
          mappings: []
          tags: []
    nullable: true
    metadata:
      description: Details of the purchase made by the user
      mappings: []
      tags: []
  - name: type
    type: string
    nullable: true
    metadata:
      description: Type of the account
      mappings: []
      tags: []
  - name: user
    type:
      type: struct
      fields:
      - name: contact
        type:
          type: struct
          fields:
          - name: address
            type:
              type: struct
              fields:
              - name: city
                type: string
                nullable: true
                metadata:
                  description: City where the user resides
                  mappings: []
                  tags: []
              - name: location
                type:
                  type: struct
                  fields:
                  - name: lat
                    type: double
                    nullable: true
                    metadata:
                      description: Latitude coordinate of the user's address location
                      mappings: []
                      tags: []
                  - name: lng
                    type: double
                    nullable: true
                    metadata:
                      description: Longitude coordinate of the user's address location
                      mappings: []
                      tags: []
                nullable: true
                metadata:
                  description: Geographical location details of the user's address
                  mappings: []
                  tags: []
              - name: state
                type: string
                nullable: true
                metadata:
                  description: The state where the user resides
                  mappings: []
                  tags: []
              - name: street
                type: string
                nullable: true
                metadata:
                  description: The street address of the user
                  mappings: []
                  tags: []
              - name: zip
                type: string
                nullable: true
                metadata:
                  description: The zip code of the user's address
                  mappings: []
                  tags: []
            nullable: true
            metadata:
              description: The complete address of the user
              mappings: []
              tags: []
          - name: phone
            type:
              type: struct
              fields:
              - name: home
                type: string
                nullable: true
                metadata:
                  description: The home phone number of the user
                  mappings: []
                  tags: []
              - name: work
                type: string
                nullable: true
                metadata:
                  description: The work phone number of the user
                  mappings: []
                  tags: []
            nullable: true
            metadata:
              description: Contact information for the user's phone
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: Contact details of the user
          mappings: []
          tags: []
      - name: email
        type: string
        nullable: true
        metadata:
          description: Email address of the user
          mappings: []
          tags: []
      - name: id
        type: string
        nullable: true
        metadata:
          description: Unique identifier for the user
          mappings: []
          tags: []
      - name: name
        type:
          type: struct
          fields:
          - name: first
            type: string
            nullable: true
            metadata:
              description: First name of the user
              mappings: []
              tags: []
          - name: last
            type: string
            nullable: true
            metadata:
              description: The last name of the user
              mappings: []
              tags: []
          - name: middle
            type: string
            nullable: true
            metadata:
              description: The middle name of the user
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: Full name of the user
          mappings: []
          tags: []
      - name: preferences
        type:
          type: struct
          fields:
          - name: notifications
            type:
              type: struct
              fields:
              - name: email
                type: boolean
                nullable: true
                metadata:
                  description: Flag indicating if the user wants to receive email
                    notifications
                  mappings: []
                  tags: []
              - name: push
                type:
                  type: struct
                  fields:
                  - name: enabled
                    type: boolean
                    nullable: true
                    metadata:
                      description: Indicates if push notifications are enabled for
                        the user
                      mappings: []
                      tags: []
                  - name: frequency
                    type: string
                    nullable: true
                    metadata:
                      description: Frequency at which the user prefers to receive
                        push notifications
                      mappings: []
                      tags: []
                nullable: true
                metadata:
                  description: User's preferences for push notifications
                  mappings: []
                  tags: []
              - name: sms
                type: boolean
                nullable: true
                metadata:
                  description: Indicates if SMS notifications are enabled for the
                    user
                  mappings: []
                  tags: []
            nullable: true
            metadata:
              description: User's notification preferences
              mappings: []
              tags: []
          - name: theme
            type: string
            nullable: true
            metadata:
              description: User's selected theme preference
              mappings: []
              tags: []
        nullable: true
        metadata:
          description: User's preferences regarding account settings
          mappings: []
          tags: []
    nullable: true
    metadata:
      description: Information related to the user account
      mappings: []
      tags: []
